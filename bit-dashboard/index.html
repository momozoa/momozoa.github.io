<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIT 통합 관제 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div id="dashboard">
    <header>
      <h1>🚌 BIT 통합 관제 대시보드</h1>
      <div class="header-controls">
        <select id="theme-selector" aria-label="테마 선택">
          <option value="dark">🌙 Dark Glass</option>
          <option value="light">☀️ Light Glass</option>
          <option value="neon">🤖 Neon Cyber</option>
        </select>
        <div id="last-updated">최종 업데이트: -</div>
      </div>
    </header>

    <!-- [1] 상단 요약 영역 -->
    <section id="summary-section" class="card">
      <!-- JavaScript로 동적 생성 -->
    </section>

    <!-- [2] 필터 및 검색 영역 -->
    <section id="controls-section" class="card">
      <div class="filters">
        <span>상태 필터:</span>
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="fault">장애</button>
        <button class="filter-btn" data-filter="normal">정상</button>
      </div>
      <div class="search">
        <input type="text" id="search-input" placeholder="시설물명 또는 정류장 ID 검색..." />
      </div>
      <div class="view-toggle">
        <span>보기 모드:</span>
        <button id="grid-view-btn" class="view-btn active">■ 그리드</button>
        <button id="table-view-btn" class="view-btn">☰ 테이블</button>
      </div>
    </section>

    <!-- [3] 단말기 목록 영역 -->
    <main id="device-list-section" class="card">
      <div id="grid-view" class="view active">
        <!-- JavaScript로 동적 생성 -->
      </div>
      <div id="table-view" class="view">
        <table>
          <thead>
            <tr>
              <th>상태</th>
              <th>종류</th>
              <th>시설물명</th>
              <th>정류장 ID</th>
              <th>장애 유형</th>
              <th>발생 시간</th>
            </tr>
          </thead>
          <tbody>
            <!-- JavaScript로 동적 생성 -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- [4] 상세 정보 패널 -->
    <aside id="details-panel">
      <button id="close-panel-btn">✕</button>
      <h2>상세 정보</h2>
      <div id="details-content">
        <!-- JavaScript로 동적 생성 -->
      </div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>

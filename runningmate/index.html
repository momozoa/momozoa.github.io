<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>런닝 메이트 - 실시간 위치 추적</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet 지도 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="controls">
    <button id="startBtn">🏃 런닝 시작 (화면 켜짐 유지)</button>
    <button id="helpBtn" aria-label="도움말">?</button>
    <div id="status">대기 중...</div>
  </div>
  <div id="coords">위치 권한을 허용해주세요.</div>
  <div id="map"></div>

  <!-- 도움말 모달 -->
  <div id="helpModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h3>화면 권한 안내</h3>
      <p>⚠️ <strong>주의:</strong> 휴대폰 화면이 꺼지면 GPS 추적이 중단될 수 있습니다.</p>
      <p>이 웹앱은 정확한 러닝 기록을 위해 <strong>화면이 켜진 상태를 자동으로 유지</strong>합니다.</p>
      <p>배터리 소모가 늘어날 수 있으니 주의해 주세요.</p>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>

</html>

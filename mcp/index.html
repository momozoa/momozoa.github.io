<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>한국어 요약 클라이언트</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    textarea {
      width: 80%;
      height: 200px;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      resize: none;
      margin-bottom: 15px;
    }
    button {
      background: #4a90e2;
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #357abd;
    }
    .result {
      margin-top: 25px;
      width: 80%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      font-size: 17px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>🧠 한국어 요약 테스트</h1>
  <textarea id="inputText" placeholder="요약할 문장을 입력하세요."></textarea>
  <button onclick="summarize()">요약하기</button>
  <div class="result" id="resultBox">결과가 여기에 표시됩니다.</div>

  <script>
    const API_URL = "https://williemae-nonemanating-vituperatively.ngrok-free.dev/summarize"; // 같은 서버 내 API 호출

    async function summarize() {
      const text = document.getElementById("inputText").value;
      if (!text.trim()) {
        alert("문장을 입력해주세요!");
        return;
      }

      document.getElementById("resultBox").innerText = "⏳ 요약 중...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await res.json();
        document.getElementById("resultBox").innerText = "📄 요약 결과:\n" + data.summary;
      } catch (err) {
        document.getElementById("resultBox").innerText = "⚠️ 오류 발생: " + err.message;
      }
    }
  </script>
</body>
</html>

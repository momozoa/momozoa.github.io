<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스택뷰 샘플 - 여러 레이어</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #f8f9fa; }
    .stackview-layer {
      display: block;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.98);
      box-shadow: 0 0 32px rgba(0,0,0,0.12);
      transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s cubic-bezier(.4,0,.2,1);
      transform: translateY(100vh);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
    }
    .stackview-layer.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .stackview-header {
      position: fixed; top: 0; left: 0; width: 100vw; height: 60px;
      background: #fff; border-bottom: 1px solid #e5e5e5; z-index: 1;
    }
    .stackview-content {
      position: absolute; top: 60px; bottom: 60px; left: 0; width: 100vw; overflow-y: auto;
    }
    .stackview-footer {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 60px; background: #fff; border-top: 1px solid #e5e5e5; z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4">스택뷰 샘플 (n개 레이어)</h2>
    <button class="btn btn-primary" onclick="openStackview(0)">첫번째 레이어 열기</button>
  </div>

  <!-- 스택뷰 레이어 n개 생성 -->
  <div id="stackview-0" class="stackview-layer">
    <div class="stackview-header">
      <div class="container pt-3 position-relative mb-0" style="height:60px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.3rem;color:#555;" onclick="closeStackview()">
          <i class="bi bi-chevron-left"></i>
        </span>
        <div class="text-center fs-5 fw-bold">레이어 1</div>
      </div>
    </div>
    <div class="stackview-content">
      <div class="container">
        <p>첫번째 레이어입니다.</p>
        <button class="btn btn-success" onclick="openStackview(1)">다음 레이어 열기</button>
      </div>
    </div>
    <div class="stackview-footer"></div>
  </div>
  <div id="stackview-1" class="stackview-layer">
    <div class="stackview-header">
      <div class="container pt-3 position-relative mb-0" style="height:60px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.3rem;color:#555;" onclick="closeStackview()">
          <i class="bi bi-chevron-left"></i>
        </span>
        <div class="text-center fs-5 fw-bold">레이어 2</div>
      </div>
    </div>
    <div class="stackview-content">
      <div class="container">
        <p>두번째 레이어입니다.</p>
        <button class="btn btn-success" onclick="openStackview(2)">다음 레이어 열기</button>
      </div>
    </div>
    <div class="stackview-footer"></div>
  </div>
  <div id="stackview-2" class="stackview-layer">
    <div class="stackview-header">
      <div class="container pt-3 position-relative mb-0" style="height:60px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.3rem;color:#555;" onclick="closeStackview()">
          <i class="bi bi-chevron-left"></i>
        </span>
        <div class="text-center fs-5 fw-bold">레이어 3</div>
      </div>
    </div>
    <div class="stackview-content">
      <div class="container">
        <p>세번째 레이어입니다.</p>
        <button class="btn btn-success" onclick="openStackview(3)">다음 레이어 열기</button>
      </div>
    </div>
    <div class="stackview-footer"></div>
  </div>
  <div id="stackview-3" class="stackview-layer">
    <div class="stackview-header">
      <div class="container pt-3 position-relative mb-0" style="height:60px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.3rem;color:#555;" onclick="closeStackview()">
          <i class="bi bi-chevron-left"></i>
        </span>
        <div class="text-center fs-5 fw-bold">레이어 4</div>
      </div>
    </div>
    <div class="stackview-content">
      <div class="container">
        <p>네번째 레이어입니다.</p>
        <button class="btn btn-danger" onclick="closeStackview()">닫기</button>
      </div>
    </div>
    <div class="stackview-footer"></div>
  </div>

  <script>
    // 스택뷰 레이어 관리
    const stackviews = Array.from(document.querySelectorAll('.stackview-layer'));
    let stackHistory = [];

    function openStackview(idx) {
      stackviews[idx].classList.add('active');
      stackHistory.push(idx);
      // 모든 레이어 pointer-events: none, 최상단만 auto
      stackviews.forEach((layer, i) => {
        layer.style.pointerEvents = (i === stackHistory[stackHistory.length-1]) ? 'auto' : 'none';
      });
      // 열린 레이어 인덱스 배열을 history에 저장
      history.pushState({stackviews: [...stackHistory]}, '', location.href);
    }
    function closeStackview() {
      if (stackHistory.length > 0) {
        history.back();
      }
    }
    window.addEventListener('popstate', function(e) {
      // 열린 레이어 인덱스 배열을 복원
      stackviews.forEach((layer, i) => {
        layer.classList.remove('active');
        layer.style.pointerEvents = 'none';
      });
      stackHistory = [];
      if (e.state && Array.isArray(e.state.stackviews)) {
        e.state.stackviews.forEach((idx, i, arr) => {
          stackviews[idx].classList.add('active');
          stackviews[idx].style.pointerEvents = (i === arr.length-1) ? 'auto' : 'none';
          stackHistory.push(idx);
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Palette - 프리미엄 이모지 검색 & 조합</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-accent: #38bdf8;
            --secondary-accent: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 120px; /* Space for sequence bar */
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary-accent), var(--secondary-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Glassmorphism Search Bar */
        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 30px;
            padding: 5px;
        }

        .search-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 25px;
            width: 100%;
            font-size: 1.2rem;
            color: white;
            box-shadow: var(--glass-shadow);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* Category Tabs */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            scrollbar-width: none; /* Firefox */
        }

        .categories::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .category-btn.active {
            background: var(--primary-accent);
            color: var(--bg-color);
            border-color: var(--primary-accent);
        }

        .category-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Emoji Grid */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
        }

        .emoji-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .emoji-item:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--secondary-accent);
        }

        .emoji-item:active {
            transform: scale(0.9);
        }

        .emoji-item::after {
            content: attr(data-name);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .emoji-item:hover::after {
            opacity: 1;
        }

        /* Floating Sequence Bar */
        .sequence-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary-accent);
            border-radius: 24px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .sequence-bar.active {
            opacity: 1;
            pointer-events: all;
            bottom: 40px;
        }

        .sequence-display {
            flex: 1;
            font-size: 1.8rem;
            white-space: nowrap;
            overflow-x: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            scrollbar-width: thin;
        }

        .sequence-item {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .sequence-item:hover {
            transform: translateY(-3px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .btn-copy {
            background: var(--primary-accent);
            color: var(--bg-color);
        }

        .btn-copy:hover {
            background: #7dd3fc;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-clear:hover {
            background: rgba(255, 100, 100, 0.2);
            color: #ef4444;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--secondary-accent);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .emoji-item { font-size: 1.8rem; }
            .btn { padding: 10px 15px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast">복사되었습니다! ✅</div>

<div class="container">
    <header>
        <h1>Emoji Palette</h1>
        <p class="subtitle">나만의 이모지 조합을 빠르게 찾아보세요</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" class="search-bar" placeholder="이모지 이름이나 키워드 검색... (예: smile, animal)" autocomplete="off">
    </div>

    <div class="categories" id="categories">
        <button class="category-btn active" data-group="All">전체</button>
        <button class="category-btn" data-group="Recent">최근 사용</button>
        <button class="category-btn" data-group="Smileys & Emotion">표정/감정</button>
        <button class="category-btn" data-group="People & Body">사람/신체</button>
        <button class="category-btn" data-group="Animals & Nature">동물/자연</button>
        <button class="category-btn" data-group="Food & Drink">음식/음료</button>
        <button class="category-btn" data-group="Travel & Places">여행/장소</button>
        <button class="category-btn" data-group="Activities">활동</button>
        <button class="category-btn" data-group="Objects">사물</button>
        <button class="category-btn" data-group="Symbols">기호</button>
        <button class="category-btn" data-group="Flags">깃발</button>
    </div>

    <div class="emoji-grid" id="grid">
        <!-- Emojis will be injected here -->
    </div>
</div>

<div class="sequence-bar" id="sequenceBar">
    <div class="sequence-display" id="sequenceDisplay"></div>
    <div class="btn-group">
        <button class="btn btn-clear" id="btnClear">Clear</button>
        <button class="btn btn-copy" id="btnCopy">Copy All</button>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const categories = document.getElementById('categories');
    const sequenceBar = document.getElementById('sequenceBar');
    const sequenceDisplay = document.getElementById('sequenceDisplay');
    const btnCopy = document.getElementById('btnCopy');
    const btnClear = document.getElementById('btnClear');
    const toast = document.getElementById('toast');

    let sequence = [];
    let recentEmojis = JSON.parse(localStorage.getItem('recent_emojis') || '[]');
    let currentGroup = 'All';
    let searchQuery = '';

    // Initialize
    function init() {
        renderEmojis();
        setupListeners();
    }

    function renderEmojis() {
        grid.innerHTML = '';
        
        let filtered = [];
        if (currentGroup === 'Recent') {
            filtered = EMOJI_DATA.filter(e => recentEmojis.includes(e.c))
                .sort((a, b) => recentEmojis.indexOf(b.c) - recentEmojis.indexOf(a.c));
        } else {
            filtered = EMOJI_DATA.filter(emoji => {
                const matchesGroup = currentGroup === 'All' || emoji.g.toLowerCase().includes(currentGroup.toLowerCase());
                const matchesSearch = emoji.n.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesGroup && matchesSearch;
            });
        }

        const displayItems = filtered.slice(0, 300);

        if (displayItems.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                ${currentGroup === 'Recent' ? '최근 사용한 이모지가 없습니다.' : '검색 결과가 없습니다.'} 😅
            </div>`;
        }

        displayItems.forEach(emoji => {
            const el = document.createElement('div');
            el.className = 'emoji-item';
            el.textContent = emoji.c;
            el.setAttribute('data-name', emoji.n);
            el.onclick = () => addToSequence(emoji.c);
            grid.appendChild(el);
        });
    }

    function addToSequence(char) {
        sequence.push(char);
        updateSequenceUI();
        saveRecent(char);
    }

    function saveRecent(char) {
        recentEmojis = [char, ...recentEmojis.filter(e => e !== char)].slice(0, 50);
        localStorage.setItem('recent_emojis', JSON.stringify(recentEmojis));
    }

    function updateSequenceUI() {
        sequenceDisplay.innerHTML = '';
        sequence.forEach((char, index) => {
            const el = document.createElement('span');
            el.className = 'sequence-item';
            el.textContent = char;
            el.onclick = () => {
                sequence.splice(index, 1);
                updateSequenceUI();
            };
            sequenceDisplay.appendChild(el);
        });

        if (sequence.length > 0) {
            sequenceBar.classList.add('active');
        } else {
            sequenceBar.classList.remove('active');
        }
    }

    function setupListeners() {
        // Search
        searchInput.oninput = (e) => {
            searchQuery = e.target.value;
            renderEmojis();
        };

        // Categories
        categories.querySelectorAll('.category-btn').forEach(btn => {
            btn.onclick = () => {
                categories.querySelector('.active').classList.remove('active');
                btn.classList.add('active');
                currentGroup = btn.getAttribute('data-group');
                renderEmojis();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
        });

        // Copy
        btnCopy.onclick = async () => {
            const text = sequence.join('');
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                // Fallback for older browsers
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast();
            }
        };

        // Clear
        btnClear.onclick = () => {
            sequence = [];
            updateSequenceUI();
        };
    }

    function showToast() {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT 최소 예제</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #result { margin-top: 32px; font-size: 1.2rem; color: #222; background: #fff; border-radius: 8px; padding: 16px 20px; min-width: 220px; min-height: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    #startBtn { margin-top: 24px; font-size: 1.1rem; padding: 12px 32px; border-radius: 24px; border: none; background: #3182ce; color: #fff; font-weight: bold; cursor: pointer; }
    #startBtn:active { background: #2563eb; }
    #status { margin-top: 18px; color: #666; font-size: 0.98rem; }
  </style>
</head>
<body>
  <button id="startBtn">🎤 음성 인식 시작</button>
  <div id="status"></div>
  <div id="result">여기에 인식 결과가 표시됩니다</div>
  <script src="stt-simple.js"></script>
</body>
</html>

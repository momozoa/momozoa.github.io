<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음악 플레이어</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-blur"></div>
  <div class="player-container">
        <div class="visualizer-wrap">
          <canvas id="visualizer" width="320" height="200"></canvas>
        </div>
    <div class="song-info">
      <span id="song-title">곡 제목</span>
      <span id="song-artist">아티스트</span>
    </div>
    <audio id="audio" src=""></audio>
    <div class="controls">
      <button id="prev" title="이전 곡">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="play" title="재생">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 4 18 12 7 20 7 4"/></svg>
      </button>
      <button id="pause" title="일시정지">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="next" title="다음 곡">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button id="stop" title="정지">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"/></svg>
      </button>
    </div>
    <input type="range" id="progress" value="0" min="0" max="100">
    <div class="volume-container">
      <button id="mute" title="음소거/해제">
        <svg id="icon-volume" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15 9.5a5 5 0 0 1 0 5"/>
          <path d="M17.5 7a9 9 0 0 1 0 10"/>
        </svg>
        <svg id="icon-mute" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="22" y1="9" x2="16" y2="15"/>
          <line x1="16" y1="9" x2="22" y2="15"/>
        </svg>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
    <ul id="playlist"></ul>
  </div>
  <script src="main.js"></script>
</body>
</html>
